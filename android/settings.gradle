pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "D4AI"
include ":app"

// Optional Capacitor plugins — only included when node_modules exists
def capSettings = file("capacitor.settings.gradle")
if (capSettings.exists()) {
    try {
        apply from: "capacitor.settings.gradle"
    } catch (Exception e) {
        // node_modules not present — pure Code Assist / WebView mode is fine
        println("Capacitor plugins skipped (node_modules missing). Using standalone WebView shell.")
    }
}
